# Garde des tests (.github/workflows/integrite.yml) — motifs Pest du module stack-laravel.
# Lu sur la BASE de la PR. Une ligne CLE=valeur, valeur jusqu'en fin de ligne.
TESTS=backend/tests
FICHIERS_TESTS=backend/tests/*.php
CONTOURNEMENT=->skip\(|->only\(|->todo\(|->skipOn|markTestSkipped|markTestIncomplete|\bxit\(|@group
ASSERTION=expect\(|->to[A-Z]|->and\(|\$this->assert|->assert[A-Z]|->throws\(
TEST=^[[:space:]]*(it|test)\(
REGLES=backend/phpunit.xml backend/phpstan.neon
# Mutation (job `mutation` de backend.yml). Dossiers depuis la racine, séparés
# par des espaces : ceux du domaine critique de CLAUDE.md, remplis à l'amorçage
# (ex. backend/app/Domain/Ledger). Le seuil part de la première mesure et ne se
# baisse jamais.
MUTATION_DOSSIERS=
MUTATION_SEUIL=
